[package]
name = "langbridge-cli"
description = "推理语言网关的命令行：画像校准、路由决策、注入与本地代理"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "langbridge"
path = "src/main.rs"

[dependencies]
langbridge-core = { path = "../langbridge-core" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
regex.workspace = true
url.workspace = true
ureq.workspace = true
