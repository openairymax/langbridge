[package]
name = "langbridge-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
langbridge-core = { path = "../langbridge-core" }
leptos.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
serde.workspace = true
serde_json.workspace = true
gloo-timers.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "Storage",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "File",
    "FileList",
    "FileReader",
    "HtmlInputElement",
    "Event",
    "EventTarget",
    "Request",
    "RequestInit",
    "RequestMode",
    "RequestCache",
    "Response",
    "Headers",
    "AbortController",
    "AbortSignal",
    "ReadableStream",
    "TextDecoder",
    "console",
] }
