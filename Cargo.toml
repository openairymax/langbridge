[workspace]
resolver = "2"
members = ["crates/langbridge-core", "crates/langbridge-cli", "crates/langbridge-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["OpenAirymax"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
ureq = { version = "2", features = ["json"] }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
